---
all:
  hosts:
    node1:
      ansible_host: 192.168.1.10
      ansible_user: ubuntu
      consul_node_role: bootstrap
    node2:
      ansible_host: 192.168.1.11
      ansible_user: ubuntu
      consul_node_role: server
    node3:
      ansible_host: 192.168.1.12
      ansible_user: ubuntu
      consul_node_role: server
  
  vars:
    ansible_python_interpreter: /usr/bin/python3
    become: yes

  children:
    postgresql_servers:
      hosts:
        node1:
        node2:
        node3:
    
    consul_servers:
      hosts:
        node1:
        node2:
        node3:
    
    patroni_servers:
      children:
        - postgresql_servers